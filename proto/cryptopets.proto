// Shared contract between services/indexer-go (server) and the Node backend (client).
// Node loads this file at runtime via @grpc/proto-loader; Go stubs are generated into
// services/indexer-go/pb with `buf generate` (see services/indexer-go/buf.gen.yaml).
syntax = "proto3";

package cryptopets;

option go_package = "github.com/radcrew/do-not-stop/services/indexer-go/pb";

service GameDataService {
  // RAM read from the write-through roster cache (coherent because
  // indexer-go is the sole writer of pet_roster after promotion). Returns
  // UNAVAILABLE until warm-up completes — callers fall back to their own
  // database read.
  rpc GetPetState(PetRequest) returns (PetResponse);

  // Pre-fight win estimate (plan §3.3): runs the round-based combat sim over
  // many seeds for pet_id1 vs pet_id2 (both read from the warm roster cache)
  // and returns pet_id1's win probability. UNAVAILABLE until the cache is warm.
  rpc EstimateWin(WinRequest) returns (WinResponse);

  // Independent recomputation of a backend-authoritative battle
  // (docs/battle-protocol.md §F). Takes everything needed to
  // rerun the fight and the progression composition — no database, no cache,
  // no chain state — so a mismatch against the TypeScript engine's own result
  // means the two implementations disagree, not that either read something
  // different. Release safety only: this does not constrain an operator who
  // controls both processes (see the architecture doc's "what the Go verifier
  // is for" section). Never wired to any state-mutating path.
  rpc VerifyBattle(VerifyBattleRequest) returns (VerifyBattleResponse);

  // VerifyBattle's job for a three-on-three team battle (docs/battle-protocol.md §F,
  // "Team battles"): the squad draw from the defender's roster, the fight, and all six
  // fighters' progression, recomputed by the Go port. The whole five-pet roster is sent,
  // not the three who fought, so the draw is checked too rather than taken on trust.
  // Release safety only, exactly as VerifyBattle.
  rpc VerifyTeamBattle(VerifyTeamBattleRequest) returns (VerifyTeamBattleResponse);
}

message PetRequest {
  string chain = 1;
  string pet_id = 2;
}

message PetResponse {
  string chain = 1;
  string pet_id = 2;
  string owner = 3;
  string name = 4;
  uint32 level = 5;
  uint32 rarity = 6;
  string dna = 7; // bigint as string, matching pet_roster.dna
  uint32 win_count = 8;
  uint32 loss_count = 9;
  int64 ready_at = 10; // unix seconds the pet is next BATTLE-ready
  uint64 version = 11;

  // v2 fields (plan §3.4, §4.1, §3.7, §4.4, §2.3). Append-only field numbers so
  // a backend on the old proto keeps working.
  uint32 xp = 12;
  uint32 generation = 13;
  string parent1_id = 14; // "0" = none
  string parent2_id = 15;
  uint32 breed_count = 16;
  uint32 species_id = 17;
  string spouse_id = 18; // "0" = unmarried
  int64 breed_ready_at = 19; // unix seconds next breed-ready
  int64 train_ready_at = 20; // unix seconds next train-ready
  string asset = 21; // Metaplex Core asset pubkey (Solana only); "" on EVM
}

message WinRequest {
  string chain = 1;
  string pet_id1 = 2; // the pet whose win probability is returned
  string pet_id2 = 3; // the opponent
  uint32 samples = 4; // seeds to sample; 0 = server default
}

message WinResponse {
  double win_probability = 1; // pet_id1's win probability in [0,1]
  uint32 samples = 2; // seeds actually sampled
}

// One pet's frozen snapshot fields, as needed to recompute a fight and its
// progression. Mirrors indexer-go's combat.PetInputs / protocol's PetSnapshot
// (the subset both computations actually read — owner, readyAt, and
// sourceVersion are not needed to run the fight).
message VerifyPetInputs {
  string pet_id = 1; // decimal string; parsed to uint64 server-side
  string dna = 2; // decimal string (16-digit DNA fits uint64)
  uint32 rarity = 3;
  uint32 level = 4;
  uint32 skill = 5;
  uint32 xp = 6;
  string last_opponent_id = 7; // decimal string; "0" = no prior opponent
  uint32 streak = 8;

  // Equipment total, already resolved from the frozen snapshot (roadmap §4).
  //
  // The resolved modifiers rather than the item ids, because that is what the fight
  // actually consumes and what the receipt publishes; the verifier has no item catalog
  // and needs none. Sent as five scalars rather than a nested message so an older server
  // sees proto3 defaults of zero, which is exactly "ungeared" — a geared battle then
  // fails §F loudly instead of being verified against the wrong inputs.
  uint32 bonus_hp = 9;
  uint32 bonus_atk = 10;
  uint32 bonus_def = 11;
  uint32 bonus_int = 12;
  uint32 bonus_mdef = 13;
}

// Mirrors protocol's SkillConfig field for field.
message VerifySkillConfig {
  uint32 tank_hp_mult = 1;
  uint32 shell_def_mult = 2;
  uint32 swift_crit_bonus = 3;
  uint32 cunning_crit_cap = 4;
  uint32 fury_dmg_mult = 5;
  uint32 fury_hp_threshold = 6;
  uint32 sage_mdef_mult = 7;
  uint32 bloodlust_bps = 8;
}

message VerifyBattleRequest {
  VerifyPetInputs attacker = 1;
  VerifyPetInputs defender = 2;
  bytes seed = 3; // 32 bytes, big-endian, matching the on-chain uint256 seed
  VerifySkillConfig skill_config = 4;
  uint32 max_level = 5;
}

// One resolved attack, in fight order. Mirrors indexer-go's
// combat.StrikeLogEntry / protocol's StrikeLogEntry field for field, so the
// caller can convert this into the same shape the TypeScript engine produces
// and hash both with @cryptopets/protocol's canonical encoding — Go never
// reimplements that encoding itself (see indexer-go's simlog.go doc comment).
message VerifyStrikeLogEntry {
  uint32 round = 1;
  uint32 attacker = 2; // 1 = pet1/attacker, 2 = pet2/defender
  bool is_magic = 3;
  bool crit = 4;
  uint64 damage = 5;
  uint64 heal = 6;
  uint32 element_mult = 7; // 85 | 100 | 115
  bool fury_triggered = 8;
  bool rebirth_triggered = 9;
  uint32 hp1_after = 10;
  uint32 hp2_after = 11;
}

// Mirrors indexer-go's combat.PetProgression / protocol's PetProgression.
message VerifyPetProgression {
  string pet_id = 1;
  bool won = 2;
  uint32 decay_shift = 3;
  uint32 xp_awarded = 4;
  string last_opponent_id = 5;
  uint32 streak = 6;
  uint32 level = 7;
  uint32 xp = 8;
  bool leveled_up = 9;
}

message VerifyBattleResponse {
  bool first_wins = 1;
  uint32 rounds = 2;
  uint32 winner_hp_remaining = 3;
  uint32 start_hp1 = 4;
  uint32 start_hp2 = 5;
  repeated VerifyStrikeLogEntry log = 6;
  VerifyPetProgression attacker = 7;
  VerifyPetProgression defender = 8;
}

// One team-battle pet: its frozen inputs and where it stands. Every pet fights neutral at
// ruleset layout 3 (Melee, no temperament), so neither is sent; Attributes 2.0 adds them.
message VerifyTeamPet {
  VerifyPetInputs pet = 1;
  uint32 col = 2; // own zone: 0 back, 1 mid, 2 front
  uint32 row = 3;
  string tactic = 4; // "focus" | "breaker" | "hunter" | "bodyguard"
  uint32 rank = 5; // roster pets only: 1-5, each once. 0 for attackers.
}

// Mirrors protocol's TeamConfig field for field.
message VerifyTeamConfig {
  string turn_order = 1; // "int" until Attributes 2.0
  uint32 combo_step_pct = 2;
  uint32 expose_pct = 3;
  uint32 aura_pct = 4;
  uint32 tailwind_bps = 5;
  uint32 long_shot_pct = 6;
  uint32 temperament_pct = 7;
}

message VerifyTeamBattleRequest {
  repeated VerifyTeamPet attackers = 1; // exactly 3, slot order
  repeated VerifyTeamPet roster = 2; // exactly 5, roster order
  bytes seed = 3; // 32 bytes, big-endian
  VerifySkillConfig skill_config = 4;
  VerifyTeamConfig team_config = 5;
  uint32 max_level = 6;
}

// One resolved team strike. Mirrors protocol's TeamStrikeLogEntry field for field, so the
// caller can hash it with the canonical encoder; Go never reimplements that encoding.
message VerifyTeamStrike {
  uint32 round = 1;
  uint32 side = 2; // 0 attackers, 1 defenders
  uint32 actor = 3;
  uint32 target = 4;
  uint32 victim = 5; // differs from target only when a Tank guarded
  bool is_magic = 6;
  bool crit = 7;
  uint64 damage = 8;
  uint32 element_mult = 9;
  uint32 combo = 10;
  bool long_shot = 11;
  bool fury_triggered = 12;
  bool temperament = 13;
  bool exposed = 14;
  bool guarded = 15;
  bool second_chance = 16;
  bool knocked_out = 17;
  uint64 heal = 18;
  int32 healed = 19; // slot on the striker's side, or -1 when nothing was healed
  uint32 victim_hp_after = 20;
}

message VerifyTeamBattleResponse {
  repeated uint32 drawn = 1; // the defenders' roster indices, in roster order
  bool attacker_wins = 2;
  uint32 rounds = 3;
  uint32 winner_hp_remaining = 4;
  repeated uint32 attacker_start_hp = 5;
  repeated uint32 defender_start_hp = 6;
  repeated VerifyTeamStrike log = 7;
  // The six fighters, attackers then drawn defenders, each by slot.
  repeated VerifyPetProgression progression = 8;
}
